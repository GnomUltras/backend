services:

  mosquitto:
    build: ./mosquitto       # uses the Dockerfile to use the volumes etc with correct rights and ownership
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - stack

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stationuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-stations}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - stack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - stack

  game-controller:
    build: ./gameController
    container_name: game-controller
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USER: ${MQTT_USER:-backend}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-testen123}
      MQTT_TOPIC: ${MQTT_TOPIC:-station/#}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-game_controller}
      MQTT_KEEPALIVE: ${MQTT_KEEPALIVE:-60}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-stations}
      DB_USER: ${POSTGRES_USER:-stationuser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      STATION_COUNT: ${STATION_COUNT:-5}
    networks:
      - stack

  backend:
    build: ./
    container_name: backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg2://stationuser:@postgres:5432/stations
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
    volumes:
      - ./:/app
    networks:
      - stack

networks:
  stack:
    driver: bridge

volumes:
  mosquitto-data:
  mosquitto-log:
  postgres-data:
  grafana-data:

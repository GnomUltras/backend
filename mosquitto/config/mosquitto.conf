listener 1883
protocol mqtt

listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Mosquitto 2.x refuses connections by default unless a listener
# explicitly allows anonymous access or an auth mechanism is set.
# For local dev/testing on your Pi's LAN this is fine; lock it down
# (password file / TLS) before exposing it beyond your network.
allow_anonymous true
